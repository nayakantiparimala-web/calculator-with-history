<!DOCTYPE html>
<html>
<head>
    <title>Calculator with History</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            text-align: center;
            padding-top: 60px;
        }

        .box {
            width: 400px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 8px;
            box-sizing: border-box;
        }

        button {
            padding: 10px 18px;
            margin: 5px;
            background: black;
            color: white;
            border: none;
            cursor: pointer;
        }

        #result {
            font-size: 20px;
            font-weight: bold;
            margin: 15px;
        }

        li {
            list-style: none;
            background: #eee;
            margin: 5px;
            padding: 8px;
        }
    </style>
</head>

<body>

    <div class="box">
        <h1>Calculator</h1>

        <input type="number" id="num1" placeholder="First number">
        <input type="number" id="num2" placeholder="Second number">

        <div>
            <button onclick="calculate('+')">+</button>
            <button onclick="calculate('-')">-</button>
            <button onclick="calculate('*')">×</button>
            <button onclick="calculate('/')">÷</button>
        </div>

        <div id="result">Result: 0</div>

        <h2>History</h2>
        <ul id="history"></ul>
    </div>

    <script>
        function calculate(operator) {

            let num1 = Number(document.getElementById("num1").value);
            let num2 = Number(document.getElementById("num2").value);
            let result;

            if (operator === "+") {
                result = num1 + num2;
            } else if (operator === "-") {
                result = num1 - num2;
            } else if (operator === "*") {
                result = num1 * num2;
            } else if (operator === "/") {

                if (num2 === 0) {
                    document.getElementById("result").innerText =
                        "Cannot divide by zero";
                    return;
                }

                result = num1 / num2;
            }

            document.getElementById("result").innerText =
                "Result: " + result;

            let historyItem = document.createElement("li");

            historyItem.innerText =
                num1 + " " + operator + " " + num2 + " = " + result;

            document.getElementById("history")
                .appendChild(historyItem);
        }
    </script>

</body>
</html>
